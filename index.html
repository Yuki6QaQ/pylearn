    <main class="page-wrap">

        <section class="hero fade-up">
            <p class="hero-eyebrow">PyLearn · Python 学习路径</p>
            <h1 class="hero-title">从零开始，<span class="grad-text">渐进式</span>掌握 Python</h1>
            <p class="hero-sub">10 个阶段 · 36 节深度课程 · 每节课含代码示例与动手练习</p>

            </div>
            <div class="stage-grid" id="stageGrid"></div>
        </section>

        <section class="section fade-up" id="lessonsSection">
            <div class="section-head">
                <h2>全部课程</h2>
                <p>点击任意课程直接进入学习</p>
            </div>
            <div class="lesson-grid" id="lessonGrid"></div>
        </section>

    </main>

    <button class="back-top" id="backTop" aria-label="返回顶部">↑</button>
