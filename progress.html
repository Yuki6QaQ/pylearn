<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyLearn · 学习进度</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/main.css">
</head>

<body data-page="progress">

    <div class="mesh-bg" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="glass-nav" id="navRoot"></header>

    <main class="page-wrap">
        <a href="index.html" class="back-link" id="backLink">
            <span class="back-arrow">←</span> 返回首页
        </a>
        <section class="section fade-up">
            <div class="section-head">
                <h2>我的学习进度</h2>
                <p>完成课程后自动记录到本地</p>
            </div>
            <div class="glass-card progress-card">
                <div class="progress-bar-wrap">
                    <div class="progress-bar" id="progressBar" style="width:0%"></div>
                </div>
                <p class="progress-text" id="progressText">已完成 0 / 36 节课</p>
                <div class="progress-actions">
                    <button class="btn btn-secondary" id="resetProgress">重置进度</button>
                </div>
            </div>
            <div class="glass-card progress-list-card" id="doneListCard">
                <h3>已完成的课程</h3>
                <ul class="done-list" id="doneList"></ul>
            </div>
        </section>
    </main>

    <button class="back-top" id="backTop" aria-label="返回顶部">↑</button>

    <script src="js/core/config.js"></script>
    <script src="js/utils/dom.js"></script>
    <script src="js/utils/storage.js"></script>
    <script src="js/utils/format.js"></script>
    <script src="js/components/theme.js"></script>
    <script src="js/components/nav.js"></script>
    <script src="js/data/stages.js"></script>
    <script src="js/data/lessons/stage-01.js"></script>
    <script src="js/data/lessons/stage-02.js"></script>
    <script src="js/data/lessons/stage-03.js"></script>
    <script src="js/data/lessons/stage-04.js"></script>
    <script src="js/data/lessons/stage-05.js"></script>
    <script src="js/data/lessons/stage-06.js"></script>
    <script src="js/data/lessons/stage-07.js"></script>
    <script src="js/data/lessons/stage-08.js"></script>
    <script src="js/data/lessons/stage-09.js"></script>
    <script src="js/data/lessons/stage-10.js"></script>
    <script src="js/data/lessons/index.js"></script>
    <script src="js/pages/progress.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
