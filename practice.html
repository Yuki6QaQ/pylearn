<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyLearn · 练习闯关</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="css/main.css">
</head>

<body data-page="practice">

    <div class="mesh-bg" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="glass-nav" id="navRoot"></header>

    <main class="page-wrap">
        <a href="index.html" class="back-link" id="backLink">
            <span class="back-arrow">←</span> 返回首页
        </a>

        <section class="section fade-up">
            <div class="section-head">
                <h2>练习闯关</h2>
                <p>选择难度，开始挑战。每题都可以运行代码、验证答案、查看参考解答。</p>
            </div>

            <div class="difficulty-tabs">
                <button class="tab-btn active" data-level="easy">简单</button>
                <button class="tab-btn" data-level="normal">普通</button>
                <button class="tab-btn" data-level="hard">困难</button>
                <button class="tab-btn" data-level="free">自由练习</button>
            </div>

            <div id="questionArea" class="question-area">
                <p class="empty-tip">加载中…</p>
            </div>
        </section>
    </main>

    <button class="back-top" id="backTop" aria-label="返回顶部">↑</button>

    <script src="js/core/config.js"></script>
    <script src="js/utils/dom.js"></script>
    <script src="js/utils/storage.js"></script>
    <script src="js/utils/format.js"></script>
    <script src="js/components/theme.js"></script>
    <script src="js/components/nav.js"></script>
    <script src="js/components/pythonRunner.js"></script>
    <script src="js/data/practiceQuestions.js"></script>
    <script src="js/pages/practice.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
